<script>
  (function() {
    let timeLeft = 42;
    let isRunning = true;
    const timerText = document.getElementById('countdown-text');
    const timerRing = document.getElementById('timer-ring');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const playPauseIcon = document.getElementById('play-pause-icon');
    
    const totalTime = 60;
    const dashArray = 289;

    function updateTimer() {
      if (!isRunning) return;
      
      if (timeLeft > 0) {
        timeLeft--;
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerText.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        
        // Update Ring
        const offset = dashArray - (timeLeft / totalTime) * dashArray;
        timerRing.style.strokeDashoffset = offset;
      }
    }

    const timerInterval = setInterval(updateTimer, 1000);

    playPauseBtn.addEventListener('click', () => {
      isRunning = !isRunning;
      playPauseIcon.innerText = isRunning ? 'pause' : 'play_arrow';
      playPauseBtn.querySelector('span:last-child').innerText = isRunning ? 'Pause' : 'Resume';
      
      if (isRunning) {
        playPauseBtn.classList.replace('bg-surface-variant', 'bg-primary');
        playPauseBtn.classList.replace('text-on-surface', 'bg-on-primary');
      } else {
        // Simple visual toggle
        playPauseBtn.classList.add('animate-pulse');
      }
    });

    // Cleanup on destroy
    window.addEventListener('beforeunload', () => clearInterval(timerInterval));
  })();
</script></main></body></html>
