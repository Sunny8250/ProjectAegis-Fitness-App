<script>
    let currentIntake = 2275;
    const dailyGoal = 3500;

    function addWater(amount) {
        currentIntake = Math.min(currentIntake + amount, dailyGoal);
        updateUI();
        
        // Haptic feedback simulation
        if (window.navigator.vibrate) {
            window.navigator.vibrate(10);
        }

        // Particle effect
        createWaterParticle();
    }

    function updateUI() {
        const percentage = Math.round((currentIntake / dailyGoal) * 100);
        const fillElement = document.getElementById('water-fill');
        const textElement = document.getElementById('percent-text');
        
        fillElement.style.height = `${percentage}%`;
        textElement.innerText = `${percentage}%`;
        
        // Update the textual display
        const statsElement = document.querySelector('.text-on-surface-variant');
        if (statsElement) {
            statsElement.innerText = `${currentIntake.toLocaleString()}ml / ${dailyGoal.toLocaleString()}ml`;
        }
    }

    function createWaterParticle() {
        const particle = document.createElement('div');
        particle.className = 'absolute z-20 pointer-events-none rounded-full bg-primary/40';
        const size = Math.random() * 20 + 10;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        
        const container = document.querySelector('.relative.z-10.w-48.h-72');
        const rect = container.getBoundingClientRect();
        
        particle.style.left = '50%';
        particle.style.top = '50%';
        particle.style.transform = 'translate(-50%, -50%)';
        
        container.appendChild(particle);
        
        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 100 + 50;
        const vx = Math.cos(angle) * velocity;
        const vy = Math.sin(angle) * velocity;
        
        let startTime = null;
        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const progress = (timestamp - startTime) / 600;
            
            if (progress < 1) {
                particle.style.transform = `translate(calc(-50% + ${vx * progress}px), calc(-50% + ${vy * progress}px)) scale(${1 - progress})`;
                particle.style.opacity = 1 - progress;
                requestAnimationFrame(animate);
            } else {
                particle.remove();
            }
        }
        requestAnimationFrame(animate);
    }
