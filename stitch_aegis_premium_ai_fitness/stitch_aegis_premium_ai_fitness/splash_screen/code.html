<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"on-background":"#d4e4fa","inverse-primary":"#006c49","on-primary-fixed":"#002113","background":"#051424","surface-tint":"#4edea3","error":"#ffb4ab","inverse-on-surface":"#233143","outline-variant":"#3c4a42","on-tertiary":"#283044",secondary:"#adc6ff","surface-container":"#122131","tertiary-fixed-dim":"#bec6e0","secondary-fixed":"#d8e2ff","inverse-surface":"#d4e4fa","on-secondary":"#002e6a","secondary-container":"#0566d9",primary:"#4edea3","on-secondary-fixed-variant":"#004395","on-tertiary-fixed":"#131b2e","surface-dim":"#051424",outline:"#86948a","on-surface":"#d4e4fa","on-secondary-container":"#e6ecff","surface-container-low":"#0d1c2d","surface-bright":"#2c3a4c","on-secondary-fixed":"#001a42","on-primary-fixed-variant":"#005236","surface-container-high":"#1c2b3c","tertiary-container":"#9ba2bb",tertiary:"#bec6e0","on-primary-container":"#00422b","surface-container-lowest":"#010f1f","on-error-container":"#ffdad6","surface-container-highest":"#273647",surface:"#051424","on-primary":"#003824","primary-fixed":"#6ffbbe","error-container":"#93000a","on-error":"#690005","primary-fixed-dim":"#4edea3","surface-variant":"#273647","tertiary-fixed":"#dae2fd","on-tertiary-container":"#31394d","on-tertiary-fixed-variant":"#3f465c","secondary-fixed-dim":"#adc6ff","primary-container":"#10b981","on-surface-variant":"#bbcabf"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{gutter:"16px",base:"4px","container-padding":"20px",sm:"12px",lg:"24px",md:"16px","2xl":"48px",xs:"8px",xl:"32px"},fontFamily:{"title-md":["Inter"],"display-lg":["Inter"],"headline-lg":["Inter"],"body-sm":["Inter"],"body-lg":["Inter"],"headline-lg-mobile":["Inter"],"headline-md":["Inter"],"label-caps":["Inter"]},fontSize:{"title-md":["18px",{lineHeight:"24px",fontWeight:"600"}],"display-lg":["48px",{lineHeight:"56px",letterSpacing:"-0.02em",fontWeight:"800"}],"headline-lg":["32px",{lineHeight:"40px",letterSpacing:"-0.01em",fontWeight:"700"}],"body-sm":["14px",{lineHeight:"20px",fontWeight:"400"}],"body-lg":["16px",{lineHeight:"24px",fontWeight:"400"}],"headline-lg-mobile":["28px",{lineHeight:"34px",letterSpacing:"-0.01em",fontWeight:"700"}],"headline-md":["24px",{lineHeight:"32px",fontWeight:"600"}],"label-caps":["12px",{lineHeight:"16px",letterSpacing:"0.05em",fontWeight:"700"}]}}}}</script></head><body class="bg-background text-on-background"><main class="w-full pt-safe pb-safe"><div class="flex flex-col w-full overflow-hidden relative" id="splash-container">
<!-- Subtle Ambient Glow Effects -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="absolute -top-[20%] -left-[10%] w-[80%] h-[60%] rounded-full opacity-20 blur-[120px] bg-primary animate-pulse" style="animation-duration: 8s;"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[70%] h-[50%] rounded-full opacity-10 blur-[100px] bg-secondary animate-pulse" style="animation-duration: 12s; animation-delay: 2s;"></div>
</div>
<!-- Content Layer -->
<div class="relative z-10 flex flex-col items-center justify-center min-h-[85vh] px-container-padding text-center">
<!-- Animated Logo Container -->
<div class="relative group mb-xl">
<!-- Outer Ring Decoration -->
<div class="absolute -inset-8 rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-1000">
<svg class="w-full h-full animate-[spin_10s_linear_infinite] opacity-20" viewbox="0 0 100 100">
<circle class="text-primary" cx="50" cy="50" fill="none" r="48" stroke="currentColor" stroke-dasharray="4 8" stroke-width="0.5"></circle>
</svg>
</div>
<!-- Primary Brand Asset -->
<div class="relative w-48 h-48 md:w-64 md:h-64 flex items-center justify-center transform transition-transform duration-700 hover:scale-105" id="logo-wrapper">
<img alt="Aegis Brand Logo" class="w-full h-full object-contain drop-shadow-[0_0_30px_rgba(78,222,163,0.3)] opacity-0 translate-y-4" id="main-logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCWmoIYlpUMzayJEQfjhfNCFiJszAxInKcDJb19eMXoZhdeD0fQnTrVz8wKKm0REP6nqUwy8EUGW2-QQbWFPefxPIO49ycfVF3RcmBZgXfEhuuf9vLTT9JaR8W1jSPCJyVWOsctXxdnaZSOYbWvEJEOkMTf1mIyiYL43vT_OiEJOPR7VA8zxeznPv8qAGwpZQwmyQtvwjpCszqSl2wE-6BBS7YKFa8-gLdYX4nd9wgFYEYwlOrE2Zdfrg"/>
</div>
</div>
<!-- Typography Section -->
<div class="flex flex-col items-center space-y-base">
<h1 class="font-display-lg text-display-lg text-on-background tracking-tighter opacity-0 translate-y-4" id="brand-name">
        AEGIS
      </h1>
<p class="font-label-caps text-label-caps text-primary uppercase tracking-[0.4em] opacity-0 translate-y-4" id="brand-tagline">
        Precision Performance
      </p>
</div>
<!-- Loading Interaction Indicator -->
<div class="mt-2xl flex flex-col items-center space-y-md opacity-0 transition-opacity duration-1000" id="loading-area">
<div class="w-32 h-[2px] bg-surface-container-highest rounded-full overflow-hidden relative">
<div class="absolute inset-y-0 left-0 bg-primary w-0 rounded-full" id="progress-bar"></div>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant/60 animate-pulse">Initializing Neural Link...</span>
</div>
</div>
<!-- Micro-interaction Scripts -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const logo = document.getElementById('main-logo');
      const name = document.getElementById('brand-name');
      const tagline = document.getElementById('brand-tagline');
      const loading = document.getElementById('loading-area');
      const progressBar = document.getElementById('progress-bar');

      // Sequence Animation
      setTimeout(() => {
        logo.classList.remove('opacity-0', 'translate-y-4');
        logo.classList.add('opacity-100', 'translate-y-0', 'transition-all', 'duration-1000', 'ease-out');
      }, 300);

      setTimeout(() => {
        name.classList.remove('opacity-0', 'translate-y-4');
        name.classList.add('opacity-100', 'translate-y-0', 'transition-all', 'duration-700', 'ease-out');
      }, 800);

      setTimeout(() => {
        tagline.classList.remove('opacity-0', 'translate-y-4');
        tagline.classList.add('opacity-100', 'translate-y-0', 'transition-all', 'duration-700', 'ease-out');
      }, 1100);

      setTimeout(() => {
        loading.classList.remove('opacity-0');
        loading.classList.add('opacity-100');
        
        // Progress Bar Simulation
        let width = 0;
        const interval = setInterval(() => {
          if (width >= 100) {
            clearInterval(interval);
          } else {
            width += 0.8;
            progressBar.style.width = width + '%';
          }
        }, 30);
      }, 1500);
      
      // Gentle parallax on mouse/tilt
      document.addEventListener('mousemove', (e) => {
        const x = (window.innerWidth / 2 - e.pageX) / 50;
        const y = (window.innerHeight / 2 - e.pageY) / 50;
        document.getElementById('logo-wrapper').style.transform = `translate(${x}px, ${y}px)`;
      });
    });
  </script>
<!-- Decorative Grain Overlay -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] mix-blend-overlay">
<svg viewbox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<filter id="noiseFilter">
<feturbulence basefrequency="0.65" numoctaves="3" stitchtiles="stitch" type="fractalNoise"></feturbulence>
</filter>
<rect filter="url(#noiseFilter)" height="100%" width="100%"></rect>
</svg>
</div>
</div></main></body></html>
