  </head><body class="bg-background text-on-background"><main class="w-full pt-safe pb-safe"><div class="flex flex-col w-full">
<!-- Visual Accent: Animated background pattern -->
<div class="fixed inset-0 pointer-events-none opacity-20 overflow-hidden">
<svg class="w-full h-full" preserveaspectratio="xMidYMid slice" viewbox="0 0 100 100">
<defs>
<radialgradient cx="50%" cy="50%" fx="50%" fy="50%" id="grad1" r="50%">
<stop offset="0%" style="stop-color:var(--primary);stop-opacity:0.2"></stop>
<stop offset="100%" style="stop-color:transparent;stop-opacity:0"></stop>
</radialgradient>
</defs>
<circle cx="10" cy="10" fill="url(#grad1)" r="40">
<animatetransform attributename="transform" dur="20s" from="-20 -20" repeatcount="indefinite" to="20 20" type="translate"></animatetransform>
</circle>
<circle cx="90" cy="80" fill="url(#grad1)" r="30">
<animatetransform attributename="transform" dur="15s" from="10 10" repeatcount="indefinite" to="-10 -10" type="translate"></animatetransform>
</circle>
</svg>
</div>
<!-- Content Container -->
<div class="relative px-container-padding flex flex-col items-center justify-center min-h-[707px]">
<!-- Branding/Header -->
<div class="w-full max-w-md text-center mb-xl">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-surface-container-highest mb-md shadow-xl">
<span class="material-symbols-outlined text-primary text-[40px]" style="font-variation-settings: 'FILL' 1;">shield_with_heart</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-xs">Welcome to Aegis</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Elevate your performance with precision.</p>
</div>
<!-- Auth Card -->
<div class="w-full max-w-md bg-surface-container p-lg rounded-xl shadow-xl transition-all duration-500 ease-out transform translate-y-0 opacity-100" id="auth-card">
<!-- Tab Switcher -->
<div class="flex bg-surface-container-low p-base rounded-lg mb-lg">
<button class="flex-1 py-xs rounded-md font-label-caps text-label-caps transition-all bg-primary text-on-primary" id="login-tab">LOGIN</button>
<button class="flex-1 py-xs rounded-md font-label-caps text-label-caps transition-all text-on-surface-variant" id="signup-tab">SIGN UP</button>
</div>
<!-- Form Section -->
<form class="space-y-md" onsubmit="return false;">
<div class="space-y-xs">
<label class="block font-label-caps text-label-caps text-on-surface-variant ml-1">EMAIL ADDRESS</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">mail</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-md pl-[48px] pr-md text-on-background font-body-lg text-body-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/20 transition-all placeholder:text-outline" placeholder="name@company.com" type="email"/>
</div>
</div>
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="block font-label-caps text-label-caps text-on-surface-variant ml-1">PASSWORD</label>
<button class="font-label-caps text-label-caps text-primary hover:opacity-80 transition-opacity">FORGOT?</button>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">lock</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-md pl-[48px] pr-md text-on-background font-body-lg text-body-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/20 transition-all placeholder:text-outline" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-title-md text-title-md py-md rounded-lg shadow-lg shadow-primary/10 active:scale-[0.98] transition-transform flex items-center justify-center gap-xs">
          Sign In
          <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-xl flex items-center">
<div class="flex-grow h-[1px] bg-outline-variant"></div>
<span class="mx-md font-label-caps text-label-caps text-outline bg-surface-container px-base">OR CONTINUE WITH</span>
<div class="flex-grow h-[1px] bg-outline-variant"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-xs bg-surface-container-low border border-outline-variant py-md rounded-lg hover:bg-surface-container-high transition-colors active:scale-[0.98]">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M12.48 10.92v3.28h7.84c-.24 1.84-2.21 5.42-7.84 5.42-4.83 0-8.75-4-8.75-8.92s3.92-8.92 8.75-8.92c2.75 0 4.59 1.16 5.64 2.17l2.58-2.48C19.16 1.04 16.1 0 12.48 0 5.74 0 0 5.37 0 12s5.74 12 12.48 12c6.98 0 11.64-4.81 11.64-11.64 0-.81-.08-1.44-.21-2.04h-11.43z" fill="currentColor"></path>
</svg>
<span class="font-title-md text-body-sm">Google</span>
</button>
<button class="flex items-center justify-center gap-xs bg-surface-container-low border border-outline-variant py-md rounded-lg hover:bg-surface-container-high transition-colors active:scale-[0.98]">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.98.95-2.05 1.72-3.32 1.72-1.22 0-1.62-.75-3.08-.75-1.46 0-1.92.73-3.08.73-1.18 0-2.31-.88-3.32-2.13-2.07-2.58-2.61-6.65-1.07-9.08 1-1.57 2.62-2.56 4.37-2.56 1.3 0 2.21.75 3.12.75.87 0 1.9-.77 3.32-.77 1.43 0 2.65.65 3.47 1.8-3.07 1.63-2.58 6.03.4 7.3-.67 1.6-1.55 3.13-2.43 4.02zM12.12 5.05c-.05-1.85 1.52-3.48 3.33-3.55.15 1.95-1.55 3.63-3.33 3.55z" fill="currentColor"></path>
</svg>
<span class="font-title-md text-body-sm">Apple</span>
</button>
</div>
</div>
<!-- Secondary Links -->
<div class="mt-lg text-center space-y-md">
<p class="font-body-sm text-body-sm text-on-surface-variant">
        By continuing, you agree to our 
        <a class="text-primary underline underline-offset-4" href="#">Terms of Service</a>
</p>
</div>
</div>
<script>
    (function() {
      const loginTab = document.getElementById('login-tab');
      const signupTab = document.getElementById('signup-tab');
      const authCard = document.getElementById('auth-card');

      function switchTab(active, inactive) {
        active.classList.add('bg-primary', 'text-on-primary');
        active.classList.remove('text-on-surface-variant');
        inactive.classList.remove('bg-primary', 'text-on-primary');
        inactive.classList.add('text-on-surface-variant');
        
        // Add a subtle bounce animation to the card when switching
        authCard.style.transform = 'scale(0.98)';
        setTimeout(() => {
          authCard.style.transform = 'scale(1)';
        }, 100);
      }

      loginTab.addEventListener('click', () => switchTab(loginTab, signupTab));
      signupTab.addEventListener('click', () => switchTab(signupTab, loginTab));

      // Micro-interaction for input focus
      const inputs = document.querySelectorAll('input');
      inputs.forEach(input => {
        input.addEventListener('focus', () => {
          input.parentElement.querySelector('.material-symbols-outlined').style.color = 'var(--primary)';
        });
        input.addEventListener('blur', () => {
          input.parentElement.querySelector('.material-symbols-outlined').style.color = 'var(--on-surface-variant)';
        });
      });
    })();
  </script>
</div></main></body></html>
